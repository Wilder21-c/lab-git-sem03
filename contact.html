<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - El Grano Mágico</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #fdfbf7; color: #333;">

    <header style="background-color: #4a2e15; padding: 20px; text-align: center; color: white;">
        <h1 style="margin: 0; font-size: 32px;">☕ Cafetería El Grano Mágico</h1>
        <nav style="margin-top: 15px;">
            <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold; font-size: 18px;">Inicio</a>
            <a href="about.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold; font-size: 18px;">Sobre Nosotros</a>
            <a href="contact.html" style="color: #f4d03f; margin: 0 15px; text-decoration: none; font-weight: bold; font-size: 18px;">Contacto</a>
        </nav>
    </header>

    <main style="padding: 40px 20px; max-width: 800px; margin: 0 auto; text-align: center;">
        <h2 style="color: #8b5a2b;">¡Hablemos!</h2>
        <p style="font-size: 18px;">¿Tienes alguna pregunta, sugerencia o pedido especial? Nos encantaría escucharte.</p>
        
        <div style="text-align: left; background-color: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 30px;">
            <p><strong>📍 Dirección:</strong> Av. de los Granos 123, Ciudad del Café</p>
            <p><strong>📞 Teléfono:</strong> +123 456 7890</p>
            <p><strong>✉️ Email:</strong> hola@elgranomagico.com</p>
            
            <hr style="border: 1px solid #eee; margin: 20px 0;">
            
            <form action="#" style="display: flex; flex-direction: column; gap: 15px;">
                <label style="font-weight: bold; color: #4a2e15;">Tu Nombre:</label>
                <input type="text" placeholder="Escribe tu nombre" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                
                <label style="font-weight: bold; color: #4a2e15;">Tu Mensaje:</label>
                <textarea rows="4" placeholder="¿En qué te podemos ayudar?" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: none;"></textarea>
                
                <button type="button" style="background-color: #8b5a2b; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">Enviar Mensaje</button>
            </form>
        </div>
    </main>

</body>
</html>
